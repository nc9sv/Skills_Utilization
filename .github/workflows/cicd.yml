name: Skills Utilization CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Docker
        run: docker --version

      - name: Build application image
        run: |
          docker build -t skills-utilization:latest ./Skills_Utilization

      - name: Check image
        run: |
          docker images skills-utilization

      - name: Start application container
        run: |
          docker rm -f skills-utilization-ci 2>/dev/null || true
          docker run -d \
            --name skills-utilization-ci \
            -p 5000:5000 \
            skills-utilization:latest

      - name: Check container
        run: |
          docker ps --filter name=skills-utilization-ci

      - name: Check application
        run: |
          sleep 5
          curl --fail http://localhost:5000/ || exit 1

      - name: Cleanup
        if: always()
        run: |
          docker rm -f skills-utilization-ci 2>/dev/null || true
