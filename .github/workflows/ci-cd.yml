name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 123456
          POSTGRES_DB: course_recommendation_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t skills-utilization:latest ./Skills_Utilization

      - name: Run container
        run: |
          docker run -d --name skills-app \
            --network host \
            -e DATABASE_URL=postgresql://postgres:123456@localhost:5432/course_recommendation_db \
            skills-utilization:latest

      - name: Scan Docker image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: skills-utilization:latest
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image
        run: |
          docker tag skills-utilization:latest \
            ghcr.io/${{ github.repository_owner }}/skills-utilization:latest

          docker push \
            ghcr.io/${{ github.repository_owner }}/skills-utilization:latest

      - name: Wait for app to start
        run: sleep 10

      - name: Check container is running
        run: docker ps | grep skills-app

      - name: Run tests (adjust to your actual test command)
        run: docker exec skills-app pytest

      - name: Show logs on failure
        if: failure()
        run: docker logs skills-app

      - name: Stop container
        if: always()
        run: docker rm -f skills-app
